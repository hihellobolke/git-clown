[package]
name = "git-clown"
version = "0.1.0"
authors = ["hihellobolke@gmail.com"]
edition = "2021"
description = "A tool to clone git repos into a structured workspace directory (under $WORKSPACE_ROOT, defaults to ~/ws)"

[dependencies]
clap = { version = "4.0", features = ["derive", "env"] }
url = "2.4"
dirs = "5.0"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.35", features = ["full"] }
log = "0.4"
env_logger = "0.11"
colored = "2.0"
dotenvy = "0.15"
regex = "1.9"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.8"
